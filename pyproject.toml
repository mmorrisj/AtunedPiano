[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atunedpiano"
version = "0.1.0"
description = "Inharmonicity measurement and piano tuning curves"
readme = "README.md"
requires-python = ">=3.11"
# The DSP core is numpy/scipy only, by policy. See CLAUDE.md, constraint 2.
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
